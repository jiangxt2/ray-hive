name: ray-hive-cluster-it

x-ray-common: &ray-common
  image: ${RAY_HIVE_CLUSTER_RUNTIME_IMAGE:?RAY_HIVE_CLUSTER_RUNTIME_IMAGE must be set}
  environment:
    RAY_USAGE_STATS_ENABLED: "0"
    PYTHONPATH: /workspace/ray-hive/src:/workspace/ray-hive/tests
  networks: [rayhive]
  shm_size: 1gb
  mem_limit: 2g
  ulimits:
    nofile:
      soft: 200000
      hard: 200000

services:
  hiveserver2:
    image: ${RAY_HIVE_IT_HIVE_IMAGE:?RAY_HIVE_IT_HIVE_IMAGE must be set}
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: >-
        -Dhive.server2.authentication=NOSASL
        -Dhive.server2.thrift.resultset.serialize.in.tasks=false
        -Dhive.exec.mode.local.auto=true
        -Dhive.execution.engine=mr
    volumes:
      - ray-hive-cluster-warehouse:/opt/hive/data/warehouse
    networks:
      rayhive:
        ipv4_address: 10.252.0.20
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/10000'"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  ray-head:
    <<: *ray-common
    hostname: ray-head
    mem_limit: 4g
    networks:
      rayhive:
        ipv4_address: 10.252.0.10
    command:
      - ray
      - start
      - --head
      - --node-ip-address=10.252.0.10
      - --port=6379
      - --object-manager-port=8076
      - --node-manager-port=8077
      - --dashboard-host=0.0.0.0
      - --include-dashboard=true
      - --object-store-memory=536870912
      - --num-cpus=0
      - --block
    healthcheck:
      test: ["CMD", "ray", "status", "--address=10.252.0.10:6379"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  ray-worker-1:
    <<: *ray-common
    hostname: ray-worker-1
    depends_on:
      ray-head:
        condition: service_healthy
    networks:
      rayhive:
        ipv4_address: 10.252.0.11
    command:
      - ray
      - start
      - --address=ray-head:6379
      - --node-ip-address=10.252.0.11
      - --object-manager-port=8076
      - --node-manager-port=8077
      - --num-cpus=1
      - --block

  ray-worker-2:
    <<: *ray-common
    hostname: ray-worker-2
    depends_on:
      ray-head:
        condition: service_healthy
    networks:
      rayhive:
        ipv4_address: 10.252.0.12
    command:
      - ray
      - start
      - --address=ray-head:6379
      - --node-ip-address=10.252.0.12
      - --object-manager-port=8076
      - --node-manager-port=8077
      - --num-cpus=1
      - --block

  runner:
    <<: *ray-common
    hostname: runner
    depends_on:
      hiveserver2:
        condition: service_healthy
      ray-worker-1:
        condition: service_started
      ray-worker-2:
        condition: service_started
    networks:
      rayhive:
        ipv4_address: 10.252.0.30
    environment:
      RAY_USAGE_STATS_ENABLED: "0"
      PYTHONPATH: /workspace/ray-hive/src:/workspace/ray-hive/tests
      RAY_HIVE_HS2_HOST: hiveserver2
      RAY_HIVE_HS2_PORT: "10000"
      RAY_HIVE_RAY_ADDRESS: 10.252.0.10:6379
      RAY_HIVE_MIN_NODES: "3"
    command: ["sleep", "infinity"]

volumes:
  ray-hive-cluster-warehouse:

networks:
  rayhive:
    ipam:
      config:
        - subnet: 10.252.0.0/24

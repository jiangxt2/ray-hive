name: Hive integration

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: hive-it-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hive-420:
    name: Apache Hive 4.2.0
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra telemetry
      - name: Run exact ray-hive-it infrastructure
        run: ./scripts/run_hive_it.sh
      - name: Preserve Hive logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: hive-420-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/integration/logs/
          if-no-files-found: error
          retention-days: 14

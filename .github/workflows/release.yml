name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Commit SHA to validate; required for a manual run"
        required: true
        type: string
      expected_version:
        description: "Expected project version, for example 1.0"
        required: true
        type: string
      formal_publish:
        description: "Publish to TestPyPI, PyPI, and GitHub Releases"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Existing annotated tag to publish, for example v1.0"
        required: true
        default: "v1.0"
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.validate.outputs.mode }}
      sha: ${{ steps.validate.outputs.sha }}
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
      master_sha: ${{ steps.validate.outputs.master_sha }}
    steps:
      - name: Check out protected master and tags
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate candidate ancestry, identity, and tag event
        id: validate
        env:
          MODE: ${{ (github.event_name == 'push' || inputs.formal_publish == true) && 'tag' || 'dry-run' }}
          CANDIDATE_REF: ${{ github.event_name == 'push' && github.sha || inputs.candidate_sha }}
          EXPECTED_VERSION: ${{ github.event_name == 'push' && '' || inputs.expected_version }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          EVENT_SHA: ${{ github.event_name == 'push' && github.sha || inputs.candidate_sha }}
          EVENT_CREATED: ${{ github.event_name == 'push' && github.event.created || inputs.formal_publish }}
          EVENT_DELETED: ${{ github.event_name == 'push' && github.event.deleted || 'false' }}
          EVENT_FORCED: ${{ github.event_name == 'push' && github.event.forced || 'false' }}
        run: >-
          python scripts/validate_release_candidate.py
          --mode "${MODE}"
          --candidate-ref "${CANDIDATE_REF}"
          --expected-version "${EXPECTED_VERSION}"
          --tag "${RELEASE_TAG}"
          --event-sha "${EVENT_SHA}"
          --event-created "${EVENT_CREATED}"
          --event-deleted "${EVENT_DELETED}"
          --event-forced "${EVENT_FORCED}"
          --github-output "${GITHUB_OUTPUT}"
      - name: Validate candidate DCO history
        env:
          CANDIDATE_SHA: ${{ steps.validate.outputs.sha }}
        run: python scripts/check_dco.py --head "${CANDIDATE_SHA}"

  evidence:
    name: Verify exact-SHA release evidence
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      ci_run_id: ${{ steps.select.outputs.ci_run_id }}
      hive_420_run_id: ${{ steps.select.outputs.hive_420_run_id }}
      ray_cluster_run_id: ${{ steps.select.outputs.ray_cluster_run_id }}
    steps:
      - name: Check out candidate evidence tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Select unique exact-SHA evidence
        id: select
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/release_evidence.py select
          --candidate-sha "${CANDIDATE_SHA}"
          --github-output "${GITHUB_OUTPUT}"
      - name: Download CI evidence by run and artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.select.outputs.ci_artifact_id }}
          path: evidence/ci
          github-token: ${{ github.token }}
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ steps.select.outputs.ci_run_id }}
      - name: Download Hive evidence by run and artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.select.outputs.hive_420_artifact_id }}
          path: evidence/hive-420
          github-token: ${{ github.token }}
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ steps.select.outputs.hive_420_run_id }}
      - name: Download Ray cluster evidence by run and artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.select.outputs.ray_cluster_artifact_id }}
          path: evidence/ray-cluster
          github-token: ${{ github.token }}
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ steps.select.outputs.ray_cluster_run_id }}
      - name: Revalidate downloaded evidence identities
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          CI_RUN_ID: ${{ steps.select.outputs.ci_run_id }}
          HIVE_RUN_ID: ${{ steps.select.outputs.hive_420_run_id }}
          RAY_CLUSTER_RUN_ID: ${{ steps.select.outputs.ray_cluster_run_id }}
        run: |
          python scripts/release_evidence.py validate evidence/ci/ci.json \
            --expected-commit "${CANDIDATE_SHA}" \
            --expected-profile ci --expected-run-id "${CI_RUN_ID}"
          python scripts/release_evidence.py validate evidence/hive-420/hive-420.json \
            --expected-commit "${CANDIDATE_SHA}" \
            --expected-profile hive-420 --expected-run-id "${HIVE_RUN_ID}"
          python scripts/release_evidence.py validate evidence/ray-cluster/ray-cluster.json \
            --expected-commit "${CANDIDATE_SHA}" \
            --expected-profile ray-cluster --expected-run-id "${RAY_CLUSTER_RUN_ID}"

  build:
    name: Build and attest one immutable artifact
    needs: [candidate, evidence]
    if: needs.candidate.result == 'success' && needs.evidence.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra telemetry
      - name: Verify release identity and credential scan
        run: uv run --frozen python scripts/check_release.py --tag "${{ needs.candidate.outputs.tag }}"
      - run: uv run --frozen python scripts/check_spec.py
      - name: Build distributions
        run: uv run --frozen python -m build --outdir release-artifacts/packages
      - name: Check distribution metadata
        run: uv run --frozen twine check release-artifacts/packages/*
      - name: Generate SHA-256 manifest
        run: >-
          uv run --frozen python scripts/verify_release_artifacts.py
          release-artifacts/packages
          --name ray-hive
          --version "${{ needs.candidate.outputs.version }}"
          --manifest release-artifacts/SHA256SUMS
          --prepare
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a # v0.21.0
        with:
          path: .
          format: spdx-json
          output-file: release-artifacts/ray-hive.spdx.json
          upload-artifact: false
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: release-artifacts/packages/*
      - name: Upload immutable release bundle
        id: upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-bundle
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  install-smoke:
    name: Install ${{ matrix.artifact }} / ${{ matrix.profile }} / Python ${{ matrix.python }}
    needs: [candidate, evidence, build]
    if: needs.evidence.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        artifact: [wheel, sdist]
        profile: [base, telemetry]
    steps:
      - name: Download exact release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact distribution
        env:
          PROFILE: ${{ matrix.profile }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          if [[ "${ARTIFACT}" == "wheel" ]]; then
            package="$(find release/packages -maxdepth 1 -name '*.whl' -print -quit)"
          else
            package="$(find release/packages -maxdepth 1 -name '*.tar.gz' -print -quit)"
          fi
          [[ -n "${package}" ]]
          python -m venv smoke-venv
          smoke-venv/bin/python -m pip install --upgrade pip
          if [[ "${PROFILE}" == "base" ]]; then
            requirement="ray-hive @ file://$(realpath "${package}")"
          else
            requirement="ray-hive[${PROFILE}] @ file://$(realpath "${package}")"
          fi
          smoke-venv/bin/python -m pip install "${requirement}"
          smoke-venv/bin/python -c 'import ray_hive; print(ray_hive.__all__)'

  testpypi-publish:
    name: Publish the formal artifact to TestPyPI
    needs: [candidate, evidence, build, install-smoke]
    if: needs.candidate.outputs.mode == 'tag' && needs.evidence.result == 'success' && needs.build.result == 'success' && needs.install-smoke.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out candidate release notes
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - name: Download exact release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true
      - name: Verify tag and artifact manifest
        run: |
          python scripts/verify_release_tag.py \
            --tag "${{ needs.candidate.outputs.tag }}" \
            --expected-sha "${{ needs.candidate.outputs.sha }}"
          python scripts/verify_release_artifacts.py release/packages \
            --name ray-hive \
            --version "${{ needs.candidate.outputs.version }}" \
            --manifest release/SHA256SUMS
      - name: Publish to TestPyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: release/packages/

  testpypi-smoke:
    name: TestPyPI install / ${{ matrix.profile }} / Python ${{ matrix.python }}
    needs: [candidate, evidence, testpypi-publish]
    if: needs.evidence.result == 'success' && needs.testpypi-publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        profile: [base, telemetry]
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install published package from TestPyPI
        env:
          PROFILE: ${{ matrix.profile }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv smoke-venv
          smoke-venv/bin/python -m pip install --upgrade pip
          if [[ "${PROFILE}" == "base" ]]; then
            requirement="ray-hive==${VERSION}"
          else
            requirement="ray-hive[${PROFILE}]==${VERSION}"
          fi
          for attempt in 1 2 3 4 5; do
            if smoke-venv/bin/python -m pip install --no-cache-dir \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ "${requirement}"; then
              break
            fi
            [[ "${attempt}" -lt 5 ]] || exit 1
            sleep 15
          done
          smoke-venv/bin/python -c 'import ray_hive; print(ray_hive.__all__)'

  publish:
    name: Publish the same artifact to PyPI
    needs: [candidate, evidence, build, testpypi-smoke]
    if: needs.evidence.result == 'success' && needs.testpypi-smoke.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download exact release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/packages/

  github-release:
    name: Create the immutable GitHub Release
    needs: [candidate, evidence, build, publish]
    if: needs.evidence.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - name: Download exact release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true
      - name: Verify artifact manifest before release
        run: >-
          python scripts/verify_release_artifacts.py release/packages
          --name ray-hive
          --version "${{ needs.candidate.outputs.version }}"
          --manifest release/SHA256SUMS
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ needs.candidate.outputs.tag }}"
          release/packages/* release/SHA256SUMS release/ray-hive.spdx.json
          --verify-tag
          --title "ray-hive ${{ needs.candidate.outputs.tag }}"
          --notes-file "release-notes/v${{ needs.candidate.outputs.version }}.md"

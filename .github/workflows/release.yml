name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Reuse complete quality gates
    uses: ./.github/workflows/ci.yml

  hive:
    name: Reuse real Hive gate
    uses: ./.github/workflows/hive-integration.yml

  publish:
    name: Build, attest, and publish immutable artifacts
    needs: [quality, hive]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: pypi
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
      - run: uv sync --frozen --extra dev --extra telemetry
      - name: Validate release identity and credential scan
        run: uv run --frozen python scripts/check_release.py --tag "${GITHUB_REF_NAME}"
      - run: uv run --frozen python scripts/check_spec.py
      - run: uv run --frozen python -m build
      - run: uv run --frozen twine check dist/*
      - name: Verify default and telemetry installations
        run: |
          uv venv /tmp/ray-hive-release-default --python 3.12
          uv pip install --python /tmp/ray-hive-release-default/bin/python dist/*.whl
          /tmp/ray-hive-release-default/bin/python -c 'import ray_hive'
          uv venv /tmp/ray-hive-release-telemetry --python 3.12
          uv pip install --python /tmp/ray-hive-release-telemetry/bin/python "ray-hive[telemetry] @ file://$(realpath dist/*.whl)"
          /tmp/ray-hive-release-telemetry/bin/python -c 'import ray_hive; import opentelemetry'
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a # v0.21.0
        with:
          path: .
          format: spdx-json
          output-file: dist/ray-hive.spdx.json
          upload-artifact: false
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: "dist/*"
      - name: Stage only Python distributions for PyPI
        run: |
          mkdir pypi-dist
          cp dist/*.whl dist/*.tar.gz pypi-dist/
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@106e0b0b7c337fa67ed433972f777c6357f78598 # v1.13.0
        with:
          packages-dir: pypi-dist/
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes

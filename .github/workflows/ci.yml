name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      candidate_sha:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Install Python for DCO validation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate every commit trailer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python scripts/check_dco.py --base "${BASE_SHA}" --head "${HEAD_SHA}"

  static:
    name: Static and docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra telemetry
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy
      - run: uv run --frozen python scripts/check_license_headers.py
      - run: uv run --frozen python scripts/check_spec.py
      - run: uv run --frozen codespell
      - run: uv run --frozen mkdocs build --strict
      - run: uv run --frozen python scripts/check_release_workflows.py

  unit-contract:
    name: Unit and contract (Python ${{ matrix.python-version }} / Ray ${{ matrix.ray-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            ray-version: "2.55.1"
          - python-version: "3.12"
            ray-version: "2.56.1"
          - python-version: "3.12"
            ray-version: "2.57.0"
          - python-version: "3.12"
            ray-version: "2.58.0"
          - python-version: "3.12"
            ray-version: "2.59.0"
          - python-version: "3.13"
            ray-version: "2.55.1"
          - python-version: "3.13"
            ray-version: "2.56.1"
          - python-version: "3.13"
            ray-version: "2.57.0"
          - python-version: "3.13"
            ray-version: "2.58.0"
          - python-version: "3.13"
            ray-version: "2.59.0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}-ray${{ matrix.ray-version }}
      - run: uv venv --python ${{ matrix.python-version }}
      - run: >-
          uv pip install -e ".[dev,telemetry]"
          "ray[data]==${{ matrix.ray-version }}"
          "pyarrow==19.0.1"
      - name: Show resolved runtime versions
        run: >-
          .venv/bin/python -c
          "from importlib.metadata import version;
          print('ray=' + version('ray'));
          print('pyarrow=' + version('pyarrow'));
          print('thrift=' + version('thrift'))"
      - name: Run collected unit and contract gates
        run: >-
          .venv/bin/python -m pytest tests/unit tests/contract
          --cov=ray_hive --cov-report=term-missing --cov-report=xml

  thrift-codegen:
    name: Reproducible Thrift bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen python scripts/generate_thrift_stubs.py --build-image --check

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
      - run: uv sync --frozen --extra dev --extra telemetry
      - run: uv run --frozen python -m build
      - run: uv run --frozen twine check dist/*
      - name: Isolated wheel import smoke
        run: |
          uv venv /tmp/ray-hive-wheel-smoke --python 3.12
          uv pip install --python /tmp/ray-hive-wheel-smoke/bin/python dist/*.whl
          /tmp/ray-hive-wheel-smoke/bin/python -c 'import ray_hive; print(ray_hive.__all__)'

  evidence:
    name: CI release evidence
    needs: [dco, static, unit-contract, thrift-codegen, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Write successful CI evidence manifest
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: >-
          python scripts/release_evidence.py write
          --profile ci
          --commit "${CANDIDATE_SHA}"
          --run-id "${RUN_ID}"
          --run-attempt "${RUN_ATTEMPT}"
          --event "${EVENT_NAME}"
          --identity-source workflow-matrix
          --python-version 3.12
          --python-version 3.13
          --ray-version 2.55.1
          --ray-version 2.56.1
          --ray-version 2.57.0
          --ray-version 2.58.0
          --ray-version 2.59.0
          --pyarrow-version 19.0.1
          --thrift-version 0.22.0
          --suite dco-static-unit-contract-codegen-package
          --output artifacts/evidence/ci.json
      - name: Upload successful CI evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ray-hive-evidence-ci-${{ inputs.candidate_sha || github.sha }}
          path: artifacts/evidence/ci.json
          if-no-files-found: error
          retention-days: 14

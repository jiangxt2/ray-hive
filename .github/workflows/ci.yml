name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      candidate_sha:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Install Python for reusable release validation
        if: github.event_name == 'workflow_call'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate every commit trailer
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [[ -n "${PR_BASE_SHA}" ]]; then
            range="${PR_BASE_SHA}..${HEAD_SHA}"
          elif [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "${zero}" ]]; then
            range="${BEFORE_SHA}..${HEAD_SHA}"
          else
            range="${HEAD_SHA}"
          fi
          failed=0
          while read -r commit; do
            if ! git show -s --format=%B "${commit}" | grep -Eiq '^Signed-off-by: .+ <[^>]+>$'; then
              echo "Missing valid Signed-off-by trailer: ${commit}"
              failed=1
            fi
          done < <(git rev-list "${range}")
          exit "${failed}"
      - name: Validate DCO for the release candidate
        if: github.event_name == 'workflow_call'
        run: python scripts/check_dco.py "${{ inputs.candidate_sha }}"

  static:
    name: Static and docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra telemetry
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy
      - run: uv run --frozen python scripts/check_license_headers.py
      - run: uv run --frozen python scripts/check_spec.py
      - run: uv run --frozen codespell
      - run: uv run --frozen mkdocs build --strict

  unit-contract:
    name: Unit and contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev --extra telemetry
      - name: Run collected unit and contract gates
        run: >-
          uv run --frozen python -m pytest tests/unit tests/contract
          --cov=ray_hive --cov-report=term-missing --cov-report=xml

  thrift-codegen:
    name: Reproducible Thrift bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen python scripts/generate_thrift_stubs.py --build-image --check

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
      - run: uv sync --frozen --extra dev --extra telemetry
      - run: uv run --frozen python -m build
      - run: uv run --frozen twine check dist/*
      - name: Isolated wheel import smoke
        run: |
          uv venv /tmp/ray-hive-wheel-smoke --python 3.12
          uv pip install --python /tmp/ray-hive-wheel-smoke/bin/python dist/*.whl
          /tmp/ray-hive-wheel-smoke/bin/python -c 'import ray_hive; print(ray_hive.__all__)'
